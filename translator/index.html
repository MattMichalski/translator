    <body>

        <h1 class="text-center mt-5">Language Translator</h1><hr>
        <form id="translateForm">
          <div class="d-flex p-2 justify-content-center d-flex flex-column flex-md-row" id="pickLang">
            <span class="badge bg-primary align-self-center fs-6">From</span>
            <select class="form-select form-select-sm text-center w-25 me-5" name="from" id="inputLanguage">
              <option value="" selected>Please Select Language To Translate</option>
              
              <option value="en-US">English</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
              <option value="it-IT">Italian</option>
              <option value="pt-PT">Portuguese</option>
              <option value="nl-NL">Dutch</option>
              <option value="ru-RU">Russian</option>
              <option value="zh-CN">Chinese</option>
              <option value="ja-JP">Japanese</option>
              <option value="ko-KR">Korean</option>
              <option value="ar-SA">Arabic</option>
              <option value="hi-IN">Hindi</option>
              <option value="pl-PL">Polish</option>
              <option value="tr-TR">Turkish</option>
              
            </select>
            <span class="badge bg-secondary align-self-center fs-6">To</span>
            <select class="form-select text-center w-25" name="to" id="outputLanguage">
              <option value="" selected>Please Select An Output Language</option>
              
              <option value="en-US">English</option>
              <option value="fr-FR">French</option>
              <option value="de-DE">German</option>
              <option value="it-IT">Italian</option>
              <option value="pt-PT">Portuguese</option>
              <option value="nl-NL">Dutch</option>
              <option value="ru-RU">Russian</option>
              <option value="zh-CN">Chinese</option>
              <option value="ja-JP">Japanese</option>
              <option value="ko-KR">Korean</option>
              <option value="ar-SA">Arabic</option>
              <option value="hi-IN">Hindi</option>
              <option value="pl-PL">Polish</option>
              <option value="tr-TR">Turkish</option>
             
            </select>
          </div>
          <div class="d-flex p-2 justify-content-center d-flex flex-column flex-md-row">
            <span class="badge bg-primary align-self-center fs-6">From</span>
            <textarea class="form-control text-center w-25 me-5" id="textToBeTranslated" rows="2" placeholder="Text to translate" name="text"></textarea>
            
            <span class="badge bg-secondary align-self-center fs-6">To</span>
            <textarea class="form-control text-center w-25" id="Translated" name = "textTranslated" rows="2" placeholder="Translation" disabled readonly></textarea>
            
              
          </div>
          <div class="d-flex p-2 justify-content-center">
            <button class="btn btn-outline-dark my-2 me-1" type="button" form="translateForm" onclick="swap(text, Translated)">&lrarr;</button>
            <button class="btn btn-primary my-2 ms-1 me-1" type="button" value="Submit" form="translateForm" onclick="translation(from.value, to.value, text.value)">translate</button>

            <button class="btn btn-outline-dark my-2 ms-1" type="button" form="translateForm" onclick="spoken(document.getElementById('Translated').value, document.getElementById('outputLanguage').value)">🔊</button>

          </div>
          </form>
